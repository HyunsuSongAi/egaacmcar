<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGA ACM · 차량운행관리 시스템</title>
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E8EF; --line2:#EEF1F5;
  --navy:#1E2C42; --navy2:#2A3B55; --text:#1F2937; --sub:#64748B;
  --blue:#2563EB; --blue-l:#EFF6FF; --blue-b:#93B4F5;
  --green:#15803D; --green-l:#E8F7EE; --green-b:#A7DEBB;
  --amber:#F59E0B; --amber-l:#FFF8E6; --amber-b:#FBD87A; --amber-d:#92610A;
  --red:#DC2626; --red-l:#FDECEC;
  --purple:#7C3AED; --teal:#0E7490; --teal-l:#E4F6FA;
  --orange:#F26522;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 버튼 ── */
.b{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:7px;
   padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer;background:#fff;color:var(--text);white-space:nowrap}
.b:hover{filter:brightness(.96)}
.b.line{border-color:var(--line);color:#475569;background:#fff}
.b.line:hover{background:#F8FAFC}
.b.blue{background:var(--blue);color:#fff}
.b.green{background:var(--green);color:#fff}
.b.red{background:var(--red);color:#fff}
.b.navy{background:var(--navy);color:#fff}
.b.purple{background:var(--purple);color:#fff}
.b.amber{background:var(--amber);color:#3B2400}
.b.orange{background:var(--orange);color:#fff}
.b.sm{padding:4px 9px;font-size:12.5px;font-weight:600;border-radius:6px}
.b.xs{padding:2px 7px;font-size:12px;font-weight:600;border-radius:5px}
.b:disabled{opacity:.45;cursor:not-allowed}

/* ── 헤더 ── */
header{background:#fff;border-bottom:1px solid var(--line);padding:11px 22px}
.hrow{max-width:1460px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px}
.logo .sq{width:31px;height:31px;border-radius:8px;background:var(--orange);color:#fff;font-weight:800;font-size:12.5px;
  display:grid;place-items:center;letter-spacing:-.03em}
.logo b{font-size:19px;letter-spacing:-.02em;color:var(--navy)}
.logo .sys{background:var(--teal-l);color:var(--teal);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;border:1px solid #BFE7F1}
nav{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
nav button{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  color:#5B6B84;font-weight:700;font-size:13.5px;padding:8px 13px;border-radius:8px;cursor:pointer}
nav button:hover{background:#F1F5F9;color:var(--navy)}
nav button.on{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-d)}
nav button .bd{background:var(--red);color:#fff;font-size:10.5px;padding:0 5px;border-radius:99px;font-weight:800}
.hrow2{max-width:1460px;margin:7px auto 0;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.usr{text-align:right;line-height:1.35}
.usr b{font-size:13.5px}
.usr .rb{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.usr .rb.r-superadmin{background:var(--red)}
.usr .rb.r-admin{background:#B45309}
.usr .rb.r-user{background:var(--teal)}
.usr span{display:block;font-size:11.5px;color:var(--sub)}

main{max-width:1460px;margin:0 auto;padding:18px 22px 70px}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.ch .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--blue-l);color:var(--blue);flex:none}
.ch h2{margin:0;font-size:15.5px;letter-spacing:-.02em}
.ch p{margin:1px 0 0;font-size:11.5px;color:var(--sub)}
.ch .sp{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.pad{padding:16px}
.pad-t{padding:14px 16px}

/* ── 필터 바 ── */
.fbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#475569;white-space:nowrap}
/* 조회 조건 그리드: 부서선택 아래에 연도·월 */
.selgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:13px 20px;align-items:end}
.fld>label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:5px}
.fld select{width:100%}
.fld .ym{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld.meta2{font-size:12px;color:var(--sub);padding-bottom:8px}
.fld.meta2 b{color:var(--navy)}
@media(max-width:820px){.selgrid{grid-template-columns:1fr}}
select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],textarea{
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;max-width:100%}
select{cursor:pointer}
select.wide{min-width:330px;border-color:var(--blue-b)}
.meta{font-size:12px;color:var(--sub);margin:9px 0 0}

/* ── 운행일지 양식 ── */
.form{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}
.form .eyebrow{font-size:11.5px;font-weight:800;color:var(--amber-d);letter-spacing:.02em}
.form h1{margin:5px 0 4px;font-size:26px;font-weight:800;letter-spacing:.16em}
.form .sub{font-size:12.5px;color:var(--sub)}
.banner{display:flex;align-items:center;gap:9px;margin:16px 0;padding:10px 13px;border-radius:9px;font-size:13px;font-weight:700}
.banner.ok{background:var(--green-l);border:1px solid var(--green-b);color:#14603A}
.banner.warn{background:var(--amber-l);border:1px solid var(--amber-b);color:var(--amber-d)}
.banner.info{background:var(--blue-l);border:1px solid var(--blue-b);color:#1E429F}
.banner .sp{margin-left:auto}
.vbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#F8FAFC;border:1px solid var(--line2);
  border-radius:9px;padding:10px 13px;font-size:12.5px}
.vbar b{color:var(--navy)}
.vbar .odo{margin-left:auto;background:var(--amber-l);border:1px solid var(--amber-b);border-radius:8px;
  padding:6px 11px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--amber-d)}
.vbar .odo input{width:88px;text-align:right;border-color:var(--amber-b);font-family:var(--mono);font-weight:700;padding:4px 7px}
.rowtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0 9px}
.rowtools .lbl{font-size:13px;font-weight:800}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.chip.b{background:var(--blue-l);color:#1E429F;border:1px solid var(--blue-b)}
.chip.a{background:var(--amber-l);color:var(--amber-d);border:1px solid var(--amber-b)}
.rowtools .sp{margin-left:auto;display:flex;gap:6px}

/* ── 표 ── */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:separate;border-spacing:0}
th{background:var(--navy);color:#EAF0F8;font-size:11.5px;font-weight:700;padding:9px 8px;text-align:center;
  white-space:nowrap;border-right:1px solid #33455F;letter-spacing:-.01em}
th:last-child{border-right:0}
th.g{background:#1B5E3A}
th.y{background:#8A6410}
td{padding:6px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);font-size:13px;text-align:center;background:#fff}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFCFE}
td.l{text-align:left}
td.r{text-align:right}
td.g{background:var(--green-l)!important;font-family:var(--mono);font-weight:700;color:#14603A}
td.y{background:var(--amber-l)!important;font-family:var(--mono);font-weight:700;color:var(--amber-d)}
td input,td select{padding:5px 6px;font-size:12.5px;border-radius:6px;width:100%;min-width:62px}
td input.req{border-color:var(--blue-b);background:#FCFDFF}
td input.calc{background:var(--amber-l);border-color:var(--amber-b);font-family:var(--mono);font-weight:700;text-align:right}
td input.n{text-align:right;font-family:var(--mono)}
td input.tm{text-align:center;font-family:var(--mono);letter-spacing:.02em}
td .hd{cursor:grab;color:#94A3B8;font-size:14px;user-select:none}
tfoot td{background:#F1F5F9;font-weight:800;font-size:12.5px;border-top:2px solid var(--navy);color:var(--navy)}
tfoot td.g{background:var(--green-l)!important}
tfoot td.y{background:var(--amber-l)!important}
tr.dragover td{border-top:2px solid var(--blue)}
.sat{color:var(--blue);font-weight:700}
.sun{color:var(--red);font-weight:700}

/* ── 배지 ── */
.t{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t.gray{background:#EEF1F5;color:#546279}
.t.blue{background:var(--blue-l);color:#1E429F}
.t.green{background:var(--green-l);color:#14603A}
.t.amber{background:var(--amber-l);color:var(--amber-d)}
.t.red{background:var(--red-l);color:#9B1C1C}
.t.teal{background:var(--teal-l);color:var(--teal)}
.t.line{background:#fff;border:1px solid var(--line);color:#64748B}
.t.pill{border-radius:99px;border:1px solid var(--green-b);background:var(--green-l);color:#14603A;padding:3px 11px}

/* ── 가이드 ── */
.guide{background:#FFFDF3;border:1px solid var(--amber-b);border-radius:12px;margin-top:16px}
.guide>div:first-child{display:flex;align-items:center;gap:8px;padding:11px 15px;font-weight:800;font-size:13.5px;color:var(--amber-d)}
.guide .body{padding:0 17px 15px;font-size:12.5px;color:#4B5563}
.guide h5{margin:12px 0 6px;font-size:12.5px;color:#1E429F}
.guide h5::before{content:"●";color:var(--blue);margin-right:6px;font-size:9px;vertical-align:2px}
.guide ul{margin:0;padding-left:19px}
.guide li{margin:3px 0}
.guide li b{color:var(--blue)}
.guide li{margin:5px 0;line-height:1.75}
/* 실제 화면의 버튼·배지를 축소해 그대로 보여주는 표기 */
.gb{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;font-size:11.5px;
  font-weight:700;border:1px solid transparent;white-space:nowrap;vertical-align:1px}
.gb.green{background:var(--green);color:#fff}
.gb.blue{background:var(--blue);color:#fff}
.gb.red{background:var(--red);color:#fff}
.gb.navy{background:var(--navy);color:#fff}
.gb.purple{background:var(--purple);color:#fff}
.gb.amber{background:var(--amber);color:#3B2400}
.gb.orange{background:var(--orange);color:#fff}
.gb.line{background:#fff;border-color:var(--line);color:#475569}
.gb.g2{background:var(--green-l);border-color:var(--green-b);color:#14603A}
.gb.y2{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-d)}
.gb.b2{background:var(--blue-l);border-color:var(--blue-b);color:#1E429F}
.gb.gray{background:#EEF1F5;color:#546279}
.gb.teal{background:var(--teal-l);border-color:#BFE7F1;color:var(--teal)}
.gb.tab{background:#FFFDF3;border:0;border-bottom:2.5px solid var(--amber);border-radius:0;color:var(--amber-d);padding:1px 4px}
.gb.th{background:var(--navy);color:#EAF0F8}
.gb.thg{background:#1B5E3A;color:#EAF0F8}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff}
.kpi span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub)}
.kpi b{display:block;font-family:var(--mono);font-size:23px;font-weight:800;margin-top:5px}
.kpi.gray{background:#F8FAFC}.kpi.amber{background:var(--amber-l);border-color:var(--amber-b)}
.kpi.teal{background:var(--teal-l);border-color:#BFE7F1}.kpi.red{background:var(--red-l);border-color:#F5C2C2}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}

/* ── 탭 ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:700;font-size:13.5px;color:#64748B;
  cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--amber-d);border-bottom-color:var(--amber)}
.tabs button:hover{color:var(--navy)}

.empty{padding:40px 16px;text-align:center;color:var(--sub);font-size:13px}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:14px}
.pager{display:flex;gap:4px;justify-content:center;align-items:center;padding:13px}
.pager button{min-width:31px;height:31px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-weight:700;font-size:12.5px}
.pager button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{font-size:12px;color:var(--sub);margin:12px 0 0;line-height:1.7}
.note .rq{color:var(--red);font-weight:700}
.actbar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ── 로그인 ── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(180deg,#F4F6F9 0%,#E8EDF4 100%)}
.lwrap{width:100%;max-width:396px}
.lwrap .logo{justify-content:center;margin-bottom:20px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 10px 34px rgba(30,44,66,.09)}
.ltabs{display:flex;gap:3px;background:#F1F5F9;padding:3px;border-radius:9px;margin-bottom:18px}
.ltabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--sub)}
.ltabs button[aria-selected=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
label.f{display:block;margin-bottom:13px}
label.f>span{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
label.f input,label.f select,label.f textarea{width:100%}
.b.w{width:100%;justify-content:center;padding:10px}
.msg{padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:700;margin-bottom:14px}
.msg.e{background:var(--red-l);color:#9B1C1C}
.msg.s{background:var(--green-l);color:#14603A}
.lhint{margin-top:15px;text-align:center;font-size:12px;color:var(--sub);line-height:1.8}
.lhint code{font-family:var(--mono);background:#F1F5F9;padding:1px 5px;border-radius:4px}
select:has(option[value=""]:checked){color:var(--sub)}
option[value=""]{color:var(--sub)}

/* ── 모달 ── */
.mask{position:fixed;inset:0;background:rgba(16,26,40,.55);display:grid;place-items:center;padding:18px;z-index:60}
.mdl{background:#fff;border-radius:12px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mdl>.mh{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.mdl>.mh h3{margin:0;font-size:15px}
.mdl>.mh .x{margin-left:auto;background:transparent;border:0;color:#B6C4D8;font-size:19px;cursor:pointer;line-height:1}
.mdl .mb{overflow:auto;flex:1}
.mdl .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#F8FAFC}
.mdl.sm{max-width:470px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-weight:700;font-size:13px;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.28)}

@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  select.wide{min-width:0;width:100%}
  nav{width:100%;margin-left:0}
  .form h1{font-size:20px;letter-spacing:.08em}
  main{padding:14px 12px 60px}
}
/* ── 인쇄: A4 가로 최적화 ── */
.printonly{display:none}
@page{size:A4 landscape;margin:8mm}
@media print{
  header,nav,.selcard,.rowtools,.actbar,.guide,.banner,.pager,.tabs,.ch .sp,.toast,.mask,.note{display:none!important}
  body{background:#fff;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{padding:0;max-width:none}
  .card{border:0;margin:0;border-radius:0}
  .pad,.pad-t{padding:0}
  .form{border:0;padding:0;border-radius:0;margin:0!important}
  .form .eyebrow{font-size:7.5pt}
  .form h1{font-size:17pt;margin:0 0 1mm;letter-spacing:.09em}
  .form .sub{font-size:8.5pt}
  .vbar{background:#fff;border:0;padding:1.2mm 0 2mm;font-size:8.5pt;gap:8px}
  .vbar .odo{background:#fff;border:0;padding:0;margin-left:auto}
  .vbar .odo input{border:0;width:60px;font-size:8.5pt;padding:0}
  .tw{overflow:visible!important;border:0;border-radius:0}
  table{width:100%}
  /* 15행이 A4 세로를 채우도록 행 높이를 키움 */
  th{background:#E9ECEF!important;color:#000!important;border:.3pt solid #7A7A7A!important;
     padding:2.1mm .8mm;font-size:8pt;white-space:normal;min-width:0!important}
  th.g{background:#DCE9DE!important}
  th.y{background:#F3EAD2!important}
  td{border:.3pt solid #9A9A9A!important;padding:2.8mm .8mm;font-size:9pt;background:#fff!important;line-height:1.2}
  td.g{background:#F3F6F3!important;color:#000!important}
  td.y{background:#FAF6EC!important;color:#000!important}
  td input,td select{border:0!important;background:transparent!important;padding:0!important;
    font-size:9pt;min-width:0!important;width:100%;-webkit-appearance:none;appearance:none;text-align:center}
  td input.n,td input.calc{text-align:right}
  input::-webkit-calendar-picker-indicator,input::-webkit-inner-spin-button{display:none!important}
  tfoot{display:table-row-group}            /* 합계는 마지막에 한 번만 */
  tfoot td{background:#E9ECEF!important;border-top:.7pt solid #000!important;font-size:8.5pt;color:#000!important}
  thead{display:table-header-group}          /* 장이 넘어가면 머리행 반복 */
  tr{page-break-inside:avoid}                /* 칸이 잘리지 않게 */
  .c-move,.c-del{display:none!important}
  .sign{display:flex!important;margin-top:3mm}
  .ptitle{display:block!important}
  .psheet:not(:first-of-type){page-break-before:always}
}
.ptitle{display:none;font-size:11pt;font-weight:800;margin:0 0 2.5mm}
/* 인쇄용 결재란 */
.sign{gap:0;justify-content:flex-end;margin-top:4mm}
.sign>div{width:42mm;border:.4pt solid #7A7A7A;border-left:0;text-align:center}
.sign>div:first-child{border-left:.4pt solid #7A7A7A}
.sign>div span{display:block;font-size:7.5pt;background:#E9ECEF;border-bottom:.4pt solid #7A7A7A;padding:.9mm;font-weight:700}
.sign>div b{display:block;height:13mm;font-size:9pt;padding-top:3mm;font-weight:600}
</style>
</head>
<body>

<!-- ══ 로그인 ══ -->
<section id="login">
  <div class="lwrap">
    <div class="logo">

/* 1600 → 16:00, 930 → 09:30, 9 → 09:00 */
function fmtTime(v){
  const d=String(v==null?'':v).replace(/[^0-9]/g,'');
  if(!d) return '';
  let h,m;
  if(d.length<=2){ h=+d; m=0; }
  else if(d.length===3){ h=+d.slice(0,1); m=+d.slice(1); }
  else { h=+d.slice(0,2); m=+d.slice(2,4); }
  if(h>23) h=23;
  if(m>59) m=59;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function calcCost(d,types,eff,elec,fp,ep){
  const t=(types&&types.length)?types:['fuel'], sh=d/t.length; let c=0;

}

function getLog(vid,y,m){
  let l=DB.logs.find(x=>x.vehicleId===vid&&+x.year===+y&&+x.month===+m);
  if(l) return l;
  if(S.tmp&&S.tmp.vehicleId===vid&&+S.tmp.year===+y&&+S.tmp.month===+m) return S.tmp;
  const v=DB.vehicles.find(x=>x.id===vid); if(!v) return null;
  const prev=DB.logs.filter(x=>x.vehicleId===vid&&(x.year*12+x.month)<(y*12+ +m))
    .sort((a,b)=>(b.year*12+b.month)-(a.year*12+a.month))[0];
  const ft=v.fuelType||'휘발유', e=effFor(ft), p=priceFor(ft,y,m);
  const start=prev?prev.endingOdometer:(v.startingOdometer||0);
  S.tmp={id:'log_'+vid+'_'+y+'_'+ +m,vehicleId:vid,licensePlate:v.licensePlate,vehicleModel:v.model,
    project:v.project,department:v.department,year:+y,month:+m,
    title:`${v.project} ${v.licensePlate}(${v.model}) ${y}년 ${MON[m-1]}월 업무용 차량운행일지`,
    version:1,status:'draft',startingOdometer:start,endingOdometer:start,
    totalDrivenKm:0,totalBusinessKm:0,totalCommuteKm:0,fuelType:ft,
    selectedEfficiencyTypes:(e.fuelEfficiency>0?['fuel']:[]).concat(e.electricEfficiency>0?['electric']:[]),
    fuelEfficiency:e.fuelEfficiency,electricEfficiency:e.electricEfficiency,
    fuelPrice:p.pricePerUnit,electricPrice:p.electricPricePerKwh,fuelCost:0,
    submitterId:me.id,submitterName:me.name,submittedAt:null,
    approvalLine:{submitter:me.name,director:'단장',financeTeam:'전략재무팀',submitterDate:today(),status:'draft'},
    items:[],notes:'',lastUpdatedBy:me.name,updatedAt:new Date().toISOString(),_new:true};
  if(!S.tmp.selectedEfficiencyTypes.length) S.tmp.selectedEfficiencyTypes=['fuel'];
  return S.tmp;
}
function persist(l){ if(l._new){ delete l._new; DB.logs.push(l); if(S.tmp===l) S.tmp=null; } }
function recalc(l){
  let cur=l.startingOdometer, biz=0, com=0;
  l.items.forEach(it=>{
    it.startOdometer=cur;
    it.drivenKm=Math.max(0,+it.drivenKm||0);
    it.commuteKm=Math.min(Math.max(0,+it.commuteKm||0),it.drivenKm);
    it.businessKm=it.drivenKm-it.commuteKm;
    it.endOdometer=cur+it.drivenKm; cur=it.endOdometer;
    biz+=it.businessKm; com+=it.commuteKm;
  });
  l.endingOdometer=cur; l.totalDrivenKm=cur-l.startingOdometer;
  l.totalBusinessKm=biz; l.totalCommuteKm=com;
  l.fuelCost=calcCost(l.totalDrivenKm,l.selectedEfficiencyTypes,l.fuelEfficiency,l.electricEfficiency,l.fuelPrice,l.electricPrice);
  l.fuelCostSnapshot=l.fuelCost; l.fuelPriceSnapshot=l.fuelPrice;
  l.lastUpdatedBy=me.name; l.updatedAt=new Date().toISOString();
}

function rowHtml(it,gi,editable,P,rng){
  return `<tr ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')"
      ondrop="this.classList.remove('dragover');dropRow(${gi})">
    ${P?'':`<td class="c-move"><span class="hd" draggable="${editable}" ondragstart="S.drag=${gi}">⠿</span></td>`}
    <td class="num">${gi+1}</td>
    <td><input type="date" value="${esc(it.date)}" min="${rng.lo}" max="${rng.hi}" ${editable?'':'disabled'} onchange="setIt(${gi},'date',this.value)"></td>
    <td>${dow(it.date)}</td>
    <td><input type="text" class="tm" inputmode="numeric" maxlength="5" placeholder="1600" value="${esc(it.depTime)}" ${editable?'':'disabled'} onchange="setIt(${gi},'depTime',this.value)"></td>
    <td><input type="text" class="tm" inputmode="numeric" maxlength="5" placeholder="1800" value="${esc(it.arrTime)}" ${editable?'':'disabled'} onchange="setIt(${gi},'arrTime',this.value)"></td>
    <td><input type="text" class="req" value="${esc(it.driver)}" ${editable?'':'disabled'} onchange="setIt(${gi},'driver',this.value)"></td>
    <td><input type="text" class="req" value="${esc(it.depLocation)}" ${editable?'':'disabled'} onchange="setIt(${gi},'depLocation',this.value)"></td>
    <td><input type="text" value="${esc(it.destLocation)}" placeholder="목적지" ${editable?'':'disabled'} onchange="setIt(${gi},'destLocation',this.value)"></td>
    <td><input type="text" class="req" value="${esc(it.purpose)}" ${editable?'':'disabled'} onchange="setIt(${gi},'purpose',this.value)"></td>
    <td class="g">${km(it.startOdometer)}</td>
    <td><input type="number" class="req n" value="${it.drivenKm}" ${editable?'':'disabled'} onchange="setIt(${gi},'drivenKm',this.value)"></td>
    <td><input type="text" class="calc" value="${km(it.endOdometer)}" readonly tabindex="-1"></td>
    <td><input type="number" class="n" value="${it.commuteKm}" ${editable?'':'disabled'} onchange="setIt(${gi},'commuteKm',this.value)"></td>
    <td class="num" style="font-weight:700">${km(it.businessKm)}</td>
    <td><select ${editable?'':'disabled'} onchange="setIt(${gi},'vehicleStatus',this.value)">
      ${['양호','정비필요','수리중'].map(x=>`<option ${it.vehicleStatus===x?'selected':''}>${x}</option>`).join('')}</select></td>
    <td><input type="text" value="${esc(it.notes)}" placeholder="주차위치 등" ${editable?'':'disabled'} onchange="setIt(${gi},'notes',this.value)"></td>
    ${P?'':`<td class="c-del">${editable?`<button class="b red xs" title="${gi+1}번 행 삭제" onclick="delRow(${gi})">✕</button>`:'-'}</td>`}
  </tr>`;
}
/* 운행 기록 표 (base = 이 표의 첫 행이 전체에서 몇 번째인지) */
function logTable(l,rows,base,editable,P,withFoot){
  const rng=monthRange(l.year,l.month);
  return `<div class="tw"><table>
    <thead><tr>
      ${P?'':'<th class="c-move" style="width:34px">이동</th>'}
      <th style="width:34px">No</th><th style="min-width:132px">운행일자<span style="color:#FCA5A5">*</span><br><span style="font-weight:500;opacity:.75">${l.year}.${MON[l.month-1]} 한정</span></th>
      <th style="width:42px">요일</th><th style="min-width:88px">출발시간</th><th style="min-width:88px">도착시간</th>
      <th style="min-width:88px">운전자<span style="color:#FCA5A5">*</span></th><th style="min-width:96px">출발지<span style="color:#FCA5A5">*</span></th>
      <th style="min-width:96px">업무목적지</th><th style="min-width:96px">운행용도<span style="color:#FCA5A5">*</span></th>
      <th class="g" style="min-width:96px">A. 주행 전<br>계기판 (km)</th>
      <th class="g" style="min-width:84px">B. 주행거리<br>(km)<span style="color:#FDE68A">*</span></th>
      <th class="y" style="min-width:100px">A+B. 주행 후<br>계기판 (km)</th>
      <th style="min-width:76px">출퇴근용</th><th style="min-width:70px">업무용</th>
      <th style="min-width:92px">차량<br>이상유무</th><th style="min-width:120px">비고<br>(주차위치 등)</th>
      ${P?'':'<th class="c-del" style="width:44px">삭제</th>'}
    </tr></thead>
    <tbody>${rows.length?rows.map((it,i)=>rowHtml(it,base+i,editable,P,rng)).join('')
      :`<tr><td colspan="${P?16:18}" class="empty" style="border:0"><b>운행 기록이 없습니다</b>‘＋ 행 추가’를 눌러 첫 운행을 입력하세요.</td></tr>`}
    </tbody>
    ${withFoot&&l.items.length?`<tfoot><tr>
      <td colspan="${P?9:10}" class="r">당월 총 합계 (Monthly Totals)</td>
      <td class="g">${km(l.startingOdometer)} km</td>
      <td class="g">${km(l.totalDrivenKm)} km</td>
      <td class="y">${km(l.endingOdometer)} km</td>
      <td class="num">${km(l.totalCommuteKm)}</td>
      <td class="num">${km(l.totalBusinessKm)}</td>
      <td colspan="${P?2:3}" class="l" style="font-weight:600;color:var(--sub)">＊ 주행 후 최종 계기판: ${km(l.endingOdometer)}</td>
    </tr></tfoot>`:''}
  </table></div>`;
}

function curLog(){ return getLog(S.vid,S.y,S.m); }
/* A4 가로 인쇄: 이동·삭제 열을 제거한 뒤 인쇄하고 화면을 복구 */
function printLog(){
  S.printMode=true; render();
  setTimeout(()=>{ try{ window.print(); } finally { S.printMode=false; render(); } },80);
}
function setStart(v){ const l=curLog(); l.startingOdometer=+v||0; render(); }
function setIt(i,k,v){
  const l=curLog();
  if(k==='date'&&v){
    const r=monthRange(l.year,l.month);
    if(v<r.lo||v>r.hi){ toast(`운행일자는 ${l.year}년 ${+l.month}월(${r.lo} ~ ${r.hi}) 안에서만 선택할 수 있습니다`); render(); return; }
  }
  l.items[i][k] = (k==='drivenKm'||k==='commuteKm') ? +v
                : (k==='depTime'||k==='arrTime')    ? fmtTime(v)
                : v;
  render();
}
/* ＋ 행 추가 : 새로운 빈 운행 내역 1행 */
function addRow(){
  const l=curLog();
  const d=Math.min(l.items.length+1,28);
  l.items.push({id:uid('row'),date:`${l.year}-${MON[l.month-1]}-${String(d).padStart(2,'0')}`,
    depTime:'09:00',arrTime:'18:00',driver:'',depLocation:'',destLocation:'',purpose:'',
    startOdometer:l.endingOdometer,drivenKm:0,endOdometer:l.endingOdometer,
    commuteKm:0,businessKm:0,vehicleStatus:'양호',remainingFuel:'가득',notes:''});
  render(); toast('빈 행을 추가했습니다');
}
/* ⧉ 행 복사 : 마지막으로 작성된 내역을 그대로 복사 */
function copyRow(){
  const l=curLog(), last=l.items[l.items.length-1];
  if(!last) return toast('복사할 행이 없습니다');
  l.items.push({...last,id:uid('row')});
  render(); toast('마지막 행을 복사했습니다');
}
/* － 행 제거 : 가장 하단의 마지막 행 삭제 */
function popRow(){
  const l=curLog();
  if(!l.items.length) return toast('삭제할 행이 없습니다');
  l.items.pop(); render(); toast('마지막 행을 삭제했습니다');
}
/* ✕ 각 행 우측 버튼 : 원하는 행 직접 삭제 */
function delRow(i){
  const l=curLog();
  if(!l.items[i]) return;
  l.items.splice(i,1); render(); toast(`${i+1}번 행을 삭제했습니다`);
}
function dropRow(to){
  const l=curLog(), from=S.drag;
  if(from==null||from===to) return;
  l.items.splice(to,0,l.items.splice(from,1)[0]); S.drag=null; render();
}
function validate(l){
  if(!l.items.length){ toast('운행 기록을 1건 이상 입력하세요'); return false; }
  for(let i=0;i<l.items.length;i++){
    const it=l.items[i];
    if(!it.date||!it.driver||!it.depLocation||!it.purpose||!it.drivenKm){
      toast(`${i+1}번 행의 필수값(운행일자·운전자·출발지·운행용도·주행거리)을 채우세요`); return false; }
  }
  return true;
}
function saveDraft(){
  const l=curLog();
  if(!l.items.length) return toast('저장할 운행 기록이 없습니다');
  l.status='draft'; recalc(l); persist(l); render(); toast('임시 저장했습니다');
}
function saveSend(){
  const l=curLog();
  if(!validate(l)) return;
  l.status='submitted'; l.submittedAt=new Date().toISOString();
  l.submitterId=me.id; l.submitterName=me.name;
  l.approvalLine={...l.approvalLine,submitter:me.name,submitterDate:today(),status:'submitted'};
  recalc(l); persist(l); S.adminEdit=false; render(); toast('운행일지를 저장(전송)했습니다');
}
function askCancel(){
  const l=curLog();
  if(isAdmin()){
    l.status='draft'; l.submittedAt=null; S.adminEdit=false; render();
    return toast('전송을 취소했습니다. 다시 수정할 수 있습니다');
  }
  modal('전송 취소 요청','', `<div class="pad">
    <p class="note" style="margin:0 0 12px">${esc(l.title)}<br>관리자가 승인하면 다시 수정할 수 있습니다.</p>
    <label class="f" style="margin:0"><span>취소 사유</span><textarea id="cr" rows="3" placeholder="예: 주행거리 오기재"></textarea></label></div>`,
    `<button class="b line" onclick="closeModal()">닫기</button><button class="b red" onclick="sendCancel()">취소 요청 보내기</button>`,1);
}
function sendCancel(){
  const l=curLog(), r=$('#cr').value.trim();
  if(!r) return toast('취소 사유를 입력하세요');
  if(DB.cancelRequests.some(c=>c.logId===l.id&&c.status==='pending')) return toast('이미 요청한 건이 있습니다');
  DB.cancelRequests.push({id:uid('cr'),logId:l.id,licensePlate:l.licensePlate,vehicleModel:l.vehicleModel,
    project:l.project,department:l.department,year:l.year,month:l.month,reason:r,
    requesterId:me.id,requesterName:me.name,status:'pending',createdAt:new Date().toISOString()});
  closeModal(); render(); toast('전송 취소를 요청했습니다');
}

/* 연초 계기판: 해당 연도 첫 일지의 시작 계기판 → 없으면 그 이전 마지막 일지의 최종값 → 없으면 차량 등록 시작 km */
function yearStartOdo(v,y){
  const inY=DB.logs.filter(l=>l.vehicleId===v.id&&+l.year===+y).sort((a,b)=>a.month-b.month);
  if(inY.length) return inY[0].startingOdometer;
  const before=DB.logs.filter(l=>l.vehicleId===v.id&&(l.year*12+l.month)<(y*12+1))
    .sort((a,b)=>(b.year*12+b.month)-(a.year*12+a.month))[0];
  return before?before.endingOdometer:(v.startingOdometer||0);
}
function toggleYear(y){
  if(!isAdmin()) return toast('관리자 이상만 연도를 마감할 수 있습니다');
  const L=locked(y);
  DB.lockedYears = L ? DB.lockedYears.filter(x=>+x!==+y) : DB.lockedYears.concat(+y).sort((a,b)=>a-b);
  render(); toast(`${y}년을 ${L?'마감 취소':'마감'}했습니다`);
}
function printMonthly(){
  S.printMode=true; render();

}

function addDept(){
  const v=$('#nd').value.trim(); if(!v) return toast('부서명을 입력하세요');
  if(DB.departments.includes(v)) return toast('이미 있는 부서입니다');
  DB.departments.push(v); render(); toast('부서를 추가했습니다');
}
function delDept(d){ DB.departments=DB.departments.filter(x=>x!==d); DB.projects=DB.projects.filter(p=>p.department!==d); render(); toast('부서를 삭제했습니다'); }
function addProj(){
  const v=$('#np').value.trim(); if(!v) return toast('프로젝트명을 입력하세요');
  if(DB.projects.some(p=>p.name===v)) return toast('이미 있는 프로젝트입니다');
  DB.projects.push({name:v,department:$('#npd').value}); render(); toast('프로젝트를 추가했습니다');
}
function delProj(i){ DB.projects.splice(i,1); render(); toast('프로젝트를 삭제했습니다'); }

function saveVeh(id){
  const o={department:$('#v-d').value,project:$('#v-j').value.trim(),assignedUserName:$('#v-u').value.trim(),
    model:$('#v-m').value.trim(),licensePlate:$('#v-p').value.trim(),startingOdometer:+$('#v-o').value||0,
    leaseType:$('#v-l').value,leaseStartDate:$('#v-s').value,leaseEndDate:$('#v-e').value,
    acquisitionDate:$('#v-a').value,insured:$('#v-i').checked,notes:$('#v-n').value,
    fuelType:$('#v-f').value,status:$('#v-st').value,updatedAt:new Date().toISOString()};
  if(!o.licensePlate||!o.model) return toast('차량번호와 차종은 필수입니다');
  if(!o.project) return toast('프로젝트를 입력하세요');
  if(id) Object.assign(DB.vehicles.find(v=>v.id===id),o);
  else DB.vehicles.push({id:uid('veh'),createdAt:new Date().toISOString(),assignedUserId:null,...o});
  if(!DB.projects.some(p=>p.name===o.project)) DB.projects.push({name:o.project,department:o.department});
  closeModal(); render(); toast(id?'차량 정보를 저장했습니다':'차량을 등록했습니다');
}
/* 운행일지가 있어도 삭제 — 확인 후 관련 데이터까지 정리 */
function askDelVeh(id){
  const v=DB.vehicles.find(x=>x.id===id); if(!v) return;
  const logs=DB.logs.filter(l=>l.vehicleId===id);
  const crs=DB.cancelRequests.filter(c=>logs.some(l=>l.id===c.logId));
  modal('차량 삭제','되돌릴 수 없음',`<div class="pad">
    <div class="banner warn" style="margin-top:0">⚠ 삭제하면 되돌릴 수 없습니다. 필요하면 먼저 데이터 백업을 내려받으세요.</div>
    <p style="font-size:15px;margin:0 0 10px"><b class="num">${esc(v.licensePlate)}</b> · ${esc(v.model)}
      <span style="color:var(--sub);font-size:13px">— ${esc(v.project)} (${esc(v.department)})</span></p>
    <div class="tw"><table><tbody>
      <tr><td class="l">함께 삭제되는 운행일지</td><td class="r num"><b>${logs.length}건</b></td></tr>
      <tr><td class="l">함께 삭제되는 전송 취소 요청</td><td class="r num"><b>${crs.length}건</b></td></tr>
      <tr><td class="l">삭제되는 누적 주행 기록</td><td class="r num"><b>${km(logs.reduce((s,l)=>s+l.totalDrivenKm,0))} km</b></td></tr>
    </tbody></table></div>
  </div>`,
  `<button class="b line" onclick="closeModal()">취소</button>
   <button class="b red" onclick="delVehForce('${id}')">차량과 운행일지 모두 삭제</button>`,1);
}
function delVehForce(id){
  const v=DB.vehicles.find(x=>x.id===id); if(!v) return;
  const logIds=DB.logs.filter(l=>l.vehicleId===id).map(l=>l.id);
  DB.logs=DB.logs.filter(l=>l.vehicleId!==id);
  DB.cancelRequests=DB.cancelRequests.filter(c=>!logIds.includes(c.logId));
  DB.vehicles=DB.vehicles.filter(x=>x.id!==id);
  if(S.vid===id){ S.vid=null; S.tmp=null; }
  closeModal(); render();
  toast(`${v.licensePlate} 차량과 운행일지 ${logIds.length}건을 삭제했습니다`);
}

      <li><b>프로젝트</b>는 <span class="gb tab">🚚 차량 및 조직 관리</span> 에 등록된 목록에서만 고를 수 있고, 부서를 바꾸면 그 부서의 프로젝트로 목록이 바뀝니다. 일반 사용자의 조회 범위가 여기서 정해집니다.</li>
      <li>상위 권한자는 하위 권한자의 부서·프로젝트·비밀번호·권한을 변경할 수 있지만 그 반대는 불가능하고, 같은 등급끼리도 서로 변경할 수 없습니다. 권한이 없으면 <span class="gb line">변경 권한 없음</span> 으로 표시됩니다.</li>
      <li><b>master</b> 계정의 부서·프로젝트·비밀번호는 본인만 변경할 수 있습니다. 부여 가능한 권한은 내 등급보다 낮은 등급까지입니다. (현재: ${assignable().map(r=>ROLE[r].label).join(', ')||'없음'})</li>
    </ul>
    <h5>가입 승인</h5>
    <ul>
      <li><span class="gb tab">가입 대기중</span> 탭에서 <span class="gb blue">승인</span> 하면 신청자가 바로 로그인할 수 있고, <span class="gb line">거절</span> 하면 로그인이 차단됩니다. 거절한 계정도 다시 승인할 수 있습니다.</li>
      <li><span class="gb line">삭제</span> 로 계정을 지울 수 있지만 <span class="gb b2">본인</span> 계정은 실수 방지를 위해 삭제할 수 없습니다.</li>
    </ul>`)}`;
}
function setUser(id,k,v){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(!canManage(u)) return toast('이 계정을 변경할 권한이 없습니다');
  u[k]=v; render(); toast('계정 정보를 저장했습니다');
}
function delUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(!canManage(u)||u.id===me.id) return toast('이 계정을 삭제할 권한이 없습니다');
  DB.users=DB.users.filter(x=>x.id!==id); render(); toast('계정을 삭제했습니다');
}
/* 차량 및 조직 관리에 등록된 프로젝트 목록과 연동 */
function projOptions(dept,sel){
  const ps=DB.projects.filter(p=>p.department===dept);
  return `<option value="" ${sel?'':'selected'}>— 프로젝트 미지정 —</option>`
    + ps.map(p=>{
        const cnt=DB.vehicles.filter(v=>v.project===p.name).length;
        return `<option value="${esc(p.name)}" ${sel===p.name?'selected':''}>${esc(p.name)} (차량 ${cnt}대)</option>`;
      }).join('')
    + (sel&&!ps.some(p=>p.name===sel)?`<option value="${esc(sel)}" selected>${esc(sel)} (다른 부서 소속)</option>`:'');
}
function fillUserProj(){
  const d=$('#u-d'), j=$('#u-j');
  if(d&&j) j.innerHTML=projOptions(d.value,'');
}
function userModal(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(!canManage(u)) return toast('이 계정을 변경할 권한이 없습니다');
  const mine=u.id===me.id, mst=isMaster(u);
  /* master 계정은 본인만 소속·비밀번호 변경 가능 */
  const canProfile=!mst||mine;
  const roles=assignable();
  const canRole=!mine&&!mst&&roles.length>0;
  modal(`계정 수정 — ${esc(u.name)}`, roleLabel(u), `<div class="pad">
    ${mst?`<div class="banner warn" style="margin-top:0">🔒 master는 보호 계정입니다. ${mine?'본인만 소속과 비밀번호를 변경할 수 있습니다.':'다른 계정에서는 변경할 수 없습니다.'}</div>`:''}
    <div class="grid2">
      <label class="f"><span>이름</span><input type="text" id="u-n" value="${esc(u.name)}"></label>
      <label class="f"><span>아이디</span><input type="text" class="num" value="${esc(u.username)}" disabled></label>
      <label class="f"><span>부서${canProfile?'':' (변경 불가)'}</span>
        <select id="u-d" ${canProfile?'':'disabled'} onchange="fillUserProj()">${DB.departments.map(d=>`<option ${u.department===d?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="f"><span>프로젝트${canProfile?'':' (변경 불가)'}</span>
        <select id="u-j" ${canProfile?'':'disabled'}>${projOptions(u.department,u.project)}</select></label>
      <label class="f"><span>권한${canRole?'':' (변경 불가)'}</span>
        <select id="u-r" ${canRole?'':'disabled'}>
          ${canRole?roles.map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE[r].label}</option>`).join('')
                   :`<option>${roleLabel(u)}</option>`}</select></label>
      <label class="f"><span>상태</span>
        <select id="u-s">${[['approved','사용 중'],['pending','승인 대기'],['rejected','거절']].map(([k,lb])=>`<option value="${k}" ${u.status===k?'selected':''}>${lb}</option>`).join('')}</select></label>
    </div>
    <label class="f" style="margin:0"><span>새 비밀번호${canProfile?' (변경할 때만 입력)':' (변경 불가)'}</span>
      <input type="password" id="u-p" placeholder="${canProfile?'비워두면 기존 비밀번호 유지':'변경 권한 없음'}" ${canProfile?'':'disabled'}></label>
  </div>`,
  `<button class="b line" onclick="closeModal()">취소</button><button class="b blue" onclick="saveUser('${u.id}')">저장하기</button>`);
}
function saveUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(!canManage(u)) return toast('이 계정을 변경할 권한이 없습니다');
  const mine=u.id===me.id, mst=isMaster(u), canProfile=!mst||mine;
  const nm=$('#u-n').value.trim(); if(!nm) return toast('이름을 입력하세요');
  u.name=nm; u.status=$('#u-s').value;
  if(canProfile){
    u.department=$('#u-d').value; u.project=$('#u-j').value;
    const pw=$('#u-p').value; if(pw) u.password=pw;
  }
  const rl=$('#u-r'); if(rl && !rl.disabled && assignable().includes(rl.value)) u.role=rl.value;
  if(u.id===me.id) me=u;
  closeModal(); render(); toast('계정 정보를 저장했습니다');
}

/* ════════ 5. 전송 취소 요청 관리 ════════ */
function vCancels(){
  if(!isAdmin()){ tab='mycar'; return render(); }
  const mine=DB.cancelRequests;
  const t=S.ctab||'all';
  const cnt=s=>mine.filter(c=>c.status===s).length;
  const q=S.cq||'';
  const list=mine.filter(c=>(t==='all'||c.status===t) &&
    (!q||(c.licensePlate+c.vehicleModel+c.project+c.requesterName+c.reason).toLowerCase().includes(q.toLowerCase())))
    .slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  $('#main').innerHTML=`
  <div class="card">
    <div class="ch">
      <span class="ci" style="background:var(--red-l);color:var(--red)">↩</span>
      <div><h2>전송 취소 요청 관리</h2><p>저장 완료된 운행일지의 수정 요청을 승인하거나 거절합니다 · 관리자 이상 전용</p></div>
      <div class="sp"><button class="b line" onclick="render()">⟳ 새로고침</button></div>
    </div>
    <div class="pad">
      <div class="kpis">
        <div class="kpi gray"><span><i class="dot" style="background:#94A3B8"></i>전체 요청 누계</span><b>${mine.length}건</b></div>
        <div class="kpi amber"><span><i class="dot" style="background:var(--amber)"></i>승인 대기</span><b>${cnt('pending')}건</b></div>
        <div class="kpi teal"><span><i class="dot" style="background:var(--teal)"></i>승인 완료</span><b>${cnt('approved')}건</b></div>
        <div class="kpi red"><span><i class="dot" style="background:var(--red)"></i>거절됨</span><b>${cnt('rejected')}건</b></div>
      </div>
    </div>
    <div class="tabs">
      ${[['all','전체',mine.length],['pending','승인 대기',cnt('pending')],['approved','승인 완료',cnt('approved')],['rejected','거절됨',cnt('rejected')]]
        .map(([k,lb,c])=>`<button class="${t===k?'on':''}" onclick="S.ctab='${k}';render()">${lb} (${c})</button>`).join('')}
      <span style="margin-left:auto;padding:7px 0">
        <input type="text" placeholder="차량번호 · 요청자 · 사유 검색" value="${esc(q)}" style="min-width:230px" oninput="S.cq=this.value;render()"></span>
    </div>
    ${list.length?`<div class="tw" style="border-radius:0;border-left:0;border-right:0"><table>
      <thead><tr><th style="min-width:86px">요청일</th><th class="l" style="min-width:150px">차량</th><th class="l" style="min-width:200px">대상 일지</th>
        <th style="min-width:96px">요청자</th><th class="l" style="min-width:190px">취소 사유</th><th style="min-width:96px">상태</th><th style="min-width:150px">처리</th></tr></thead>
      <tbody>${list.map(c=>{
        const log=DB.logs.find(l=>l.id===c.logId);
        return `<tr>
          <td class="num" style="font-size:12px">${esc((c.createdAt||'').slice(0,10))}</td>
          <td class="l"><b>${esc(c.vehicleModel)}</b><div class="num" style="color:var(--blue);font-size:12px;font-weight:700">${esc(c.licensePlate)}</div></td>
          <td class="l">${c.year}년 ${MON[c.month-1]}월<div style="font-size:11.5px;color:var(--sub)">${esc(c.project)}</div></td>
          <td>${esc(c.requesterName)}</td>
          <td class="l" style="font-size:12.5px">${esc(c.reason)}
            ${c.decidedBy?`<div style="font-size:11px;color:var(--sub)">처리: ${esc(c.decidedBy)} · ${esc((c.decidedAt||'').slice(0,10))}</div>`:''}</td>
          <td>${{pending:'<span class="t amber">승인 대기</span>',approved:'<span class="t teal">승인 완료</span>',rejected:'<span class="t red">거절됨</span>'}[c.status]}</td>
          <td>${c.status==='pending'&&isAdmin()
            ? `<button class="b blue sm" onclick="decideCancel('${c.id}','approved')">승인</button>
               <button class="b line sm" onclick="decideCancel('${c.id}','rejected')">거절</button>`
            : log?`<button class="b line sm" onclick="openMonth('${log.vehicleId}',${c.year},${c.month})">일지 보기</button>`:'-'}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`
    :`<div class="empty"><b>해당 조건의 취소 요청 내역이 없습니다.</b>작성자가 전송 취소를 요청하면 여기에 모입니다.</div>`}
  </div>
  ${guide('cancels','↩','전송 취소 흐름 안내 — 화면의 버튼과 같은 모양으로 표시했습니다',`
    <ul>
      <li>일반 작성자가 <span class="gb blue">✈ 운행일지 저장</span> 을 마치면 데이터가 확정되어 더 이상 수정할 수 없습니다.</li>
      <li>수정이 필요하면 작성자가 <span class="gb red">↺ 전송 취소</span> 를 눌러 사유와 함께 요청을 보냅니다. 요청은 <span class="gb y2">승인 대기</span> 상태로 이 표에 쌓입니다.</li>
      <li><span class="gb blue">승인</span> 하면 해당 일지가 임시 저장 상태로 돌아가 작성자가 다시 수정할 수 있고, <span class="gb line">거절</span> 하면 확정 상태가 유지됩니다.</li>
      <li><span class="gb line">일지 보기</span> 로 대상 일지를 <span class="gb tab">🚘 나의 차량</span> 탭에서 바로 열어 확인할 수 있습니다.</li>
      <li>관리자는 취소 요청 없이도 <span class="gb amber">마스터/관리자 수정 가능 모드</span> 로 바로 수정할 수 있습니다.</li>
      <li>이 탭은 <b>관리자 이상</b>만 볼 수 있습니다. 일반 사용자는 나의 차량 탭의 <span class="gb red">↺ 전송 취소</span> 로 요청만 보내고, 진행 상태는 일지 화면 안내로 확인합니다.</li>
    </ul>`)}`;
}
function decideCancel(id,s){
  const c=DB.cancelRequests.find(x=>x.id===id); if(!c) return;
  c.status=s; c.decidedBy=me.name; c.decidedAt=new Date().toISOString();
  if(s==='approved'){
    const l=DB.logs.find(x=>x.id===c.logId);
    if(l){ l.status='draft'; l.submittedAt=null; }
  }
  render(); toast(s==='approved'?'취소 요청을 승인했습니다. 작성자가 다시 수정할 수 있습니다':'취소 요청을 거절했습니다');
}

/* ════════ 백업 ════════ */
function saveFile(name,text,type){
  const b=new Blob([text],{type:type||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function dlJson(){
  const out={...DB}; delete out._tmp;
  saveFile(`EGA_ACM_Database_Backup_${today()}.json`,JSON.stringify(out,null,2));
  toast('데이터를 백업했습니다');
}
function dlCsv(){
  const r=[['연도','월','차량번호','차종','부서','프로젝트','운행일자','요일','출발시간','도착시간','운전자','출발지','업무목적지','운행용도','주행전계기판','주행거리','주행후계기판','출퇴근용','업무용','차량이상유무','비고','상태']];
  DB.logs.slice().sort((a,b)=>(a.year*12+a.month)-(b.year*12+b.month)).forEach(l=>l.items.forEach(it=>
    r.push([l.year,l.month,l.licensePlate,l.vehicleModel,l.department,l.project,it.date,
      DOW[new Date(it.date).getDay()]||'',it.depTime,it.arrTime,it.driver,it.depLocation,it.destLocation,it.purpose,
      it.startOdometer,it.drivenKm,it.endOdometer,it.commuteKm,it.businessKm,it.vehicleStatus,it.notes,
      l.status==='submitted'?'전송완료':'임시저장'])));
  saveFile(`EGA_ACM_운행일지_${today()}.csv`,'\ufeff'+r.map(x=>x.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
  toast('엑셀(CSV) 파일을 내려받았습니다');
}
function restoreModal(){
  modal('백업 복원','', `<div class="pad">
    <p class="note" style="margin:0 0 12px">내려받은 <b>EGA_ACM_Database_Backup</b> JSON 파일을 올리면 현재 데이터를 덮어씁니다.</p>
    <input type="file" id="rf" accept=".json"></div>`,
    `<button class="b line" onclick="closeModal()">취소</button><button class="b blue" onclick="doRestore()">복원하기</button>`,1);
}
function doRestore(){
  const f=$('#rf').files[0]; if(!f) return toast('파일을 선택하세요');
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.vehicles||!d.logs) throw 0;
      DB=d; DB.cancelRequests=DB.cancelRequests||[];
      DB.logs.forEach(l=>{ if(l.status!=='draft'&&l.status!=='submitted') l.status='submitted'; });
      DB.users.forEach(u=>{ if(u.username==='master') u.role='superadmin';
        else if(u.role!=='admin'&&u.role!=='superadmin') u.role='user'; });
      normStatus();
      const u=DB.users.find(x=>x.username===me.username);
      closeModal();
      if(!u){ toast('복원한 데이터에 현재 계정이 없어 로그아웃합니다'); return logout(); }
      me=u; S={}; render(); toast('백업을 복원했습니다');
    }catch(e){ toast('EGA ACM 백업 파일이 아닙니다'); }
  };
  r.readAsText(f);
}

/* init */
fillSignup();
$('#i-u').focus();
</script>
